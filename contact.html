<main id="main" class="container py-5">
  <div class="row g-4">
    <header class="col-12 md:col-4">
      <p class="kicker">Poster Lovers / Contact</p>
      <h1 class="feature-title">Contact the studio</h1>
      <p>Have a botanical poster to share or a question about a print in the gallery?</p>
      <p class="small">
        This class project checks your enquiry in your browser. Your message stays on this device.
      </p>
    </header>

    <div class="col-12 md:col-8">
      <form class="card p-4" action="contact.html#checked" method="get">
        <div class="row g-4">
          <div class="col-12 md:col-6">
            <div class="form-field">
              <label for="first-name">First name</label>
              <input class="form-control" type="text" id="first-name"
                     autocomplete="given-name" required>
            </div>
          </div>

          <div class="col-12 md:col-6">
            <div class="form-field">
              <label for="last-name">Last name</label>
              <input class="form-control" type="text" id="last-name"
                     autocomplete="family-name" required>
            </div>
          </div>

          <div class="col-12 md:col-6">
            <div class="form-field">
              <label for="email">Email</label>
              <input class="form-control" type="email" id="email"
                     autocomplete="email" placeholder="you@example.com" required>
            </div>
          </div>

          <div class="col-12 md:col-6">
            <div class="form-field">
              <label for="enquiry-topic">Enquiry topic</label>
              <select class="form-control" id="enquiry-topic" required>
                <option value="">Choose a topic</option>
                <option value="gallery">Ask about a gallery poster</option>
                <option value="suggestion">Suggest a botanical print</option>
                <option value="feedback">Share feedback on the collection</option>
              </select>
            </div>
          </div>

          <div class="col-12 md:col-6">
            <div class="form-field">
              <label for="message">Message</label>
              <textarea class="form-control" id="message" rows="4" required></textarea>
            </div>
          </div>

          <div class="col-12 md:col-6">
            <div class="form-field">
              <input class="check" type="checkbox" id="consent" required>
              <label for="consent">I agree to have this demo check my enquiry locally.</label>
            </div>
          </div>
        </div>

        <div class="mt-4">
          <button class="btn-solid theme-primary" type="submit">Check enquiry</button>
        </div>
      </form>

      <p id="checked" class="p-3 mt-3" tabindex="-1">
        Your enquiry passed the form checks. No message was sent.
      </p>
    </div>
  </div>
</main>
